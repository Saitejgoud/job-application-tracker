server.port=${PORT:8080}

# ---------- Database (env variables when deployed, defaults for local) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- CORS ----------
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}

# ---------- JWT ----------
# Must be at least 32 characters. Set JWT_SECRET in production (never commit a real secret).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-1234}
app.jwt.expiration-ms=86400000

# ---------- Optional: create an admin user at startup ----------
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
