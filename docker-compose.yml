
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: job_tracker
      MYSQL_USER: job_user
      MYSQL_PASSWORD: local_db_password
      MYSQL_ROOT_PASSWORD: local_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped



  
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DB_URL: "jdbc:mysql://mysql:3306/job_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: job_user
      DB_PASSWORD: local_db_password
      APP_CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: local-development-secret-change-this-before-deployment-123456789
      ADMIN_NAME: Admin
      ADMIN_EMAIL: saitej@gmail.com
      ADMIN_PASSWORD: Saitej!
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
